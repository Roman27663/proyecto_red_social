<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar · Bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#f6f7fb;--card:#ffffff;--text:#0f1419;--muted:#6b7280;
    --border:#eef0f4;--brand:#7c5cff;--brand-dark:#5b3df5;
    --radius:18px;--radius-sm:12px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;}
  a{color:var(--brand);text-decoration:none;}
  a:hover{color:var(--brand-dark);}
  .container{max-width:560px;margin:0 auto;padding:32px 16px 60px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-bottom:18px;}
  h2{margin:0 0 18px;font-size:22px;}

  .search-box{
    display:flex;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow);margin-bottom:24px;
  }
  .search-box i{align-self:center;color:var(--muted);}
  .search-box input[type="text"]{
    flex:1;border:none;outline:none;font-family:inherit;font-size:15px;
    background:transparent;padding:10px 0;
  }
  .search-box button{
    background:var(--brand);color:#fff;border:none;padding:10px 20px;
    border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .search-box button:hover{background:var(--brand-dark);}

  .result-row{
    display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .avatar-sm{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;text-transform:uppercase;flex-shrink:0;
  }
  .result-row a{font-weight:600;color:var(--text);}
  .result-row a:hover{color:var(--brand);}

  .empty-state{text-align:center;color:var(--muted);background:var(--card);padding:26px;border-radius:var(--radius);border:1px dashed var(--border);}
</style>
</head>
<body>
<div class="container">

    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>

    <h2>Buscar usuarios</h2>

    <form method="GET" class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" name="q" placeholder="Buscar usuario..." value="{{ query }}">
        <button type="submit">Buscar</button>
    </form>

    {% for user in resultados %}
        <div class="result-row">
            <div class="avatar-sm">{{ user.username|slice:":1" }}</div>
            <a href="/perfil/{{ user.username }}/">{{ user.username }}</a>
        </div>
    {% empty %}
        {% if query %}
            <div class="empty-state">No se encontraron usuarios</div>
        {% endif %}
    {% endfor %}

</div>
</body>
</html>
